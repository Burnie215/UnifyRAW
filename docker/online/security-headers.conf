# nginx vererbt add_header NICHT in ein location-Block, der eigene add_header
# hat. Jeder Block, der Cache-Header setzt, wuerde die Sicherheitsheader sonst
# stillschweigend loeschen — deshalb liegen sie hier und werden ueberall
# eingebunden. (Gemessen 2026-09-05: ohne das kam auf / kein einziger davon an.)
# connect-src blob: - the app fetch()es its own object URLs (preset thumbnails,
# node previews, RAW previews); without it those break under this policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https: blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Die Alpha warnt beim ersten Start ausdruecklich vor sich selbst — sie hat in
# einer Suchtrefferliste nichts verloren. Der Header wirkt unabhaengig von
# robots.txt und auch dort, wo Cloudflare eine eigene voranstellt.
# Entfernen, sobald die Version nicht mehr Alpha ist.
add_header X-Robots-Tag "noindex, nofollow" always;

