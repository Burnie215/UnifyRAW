# Statische Auslieferung des Online-Builds (ONLINE_MODE_PLAN §P6/§P7).
# Kein Backend: der Server liefert nur das Bundle aus und sieht nie ein Bild.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Kein Zugriffsprotokoll. Die App ist statisch, und die Datenschutzerklaerung
  # sagt zu, dass UnifyRAW selbst keine Zugriffe mitschreibt - wie die Website.
  # Ohne diese Zeile schreibt nginx:alpine jeden Abruf nach stdout.
  access_log off;

  # Absichtlich KEIN COOP/COEP. libraw-wasm und onnxruntime bringen zwar
  # Thread-Varianten mit, laufen ohne SharedArrayBuffer aber einfaedig — so
  # wie im Selfhost-Build. Cross-Origin-Isolation wuerde
  # stattdessen die Direktverbindungen aus §P4 brechen, weil sie CORP-Header
  # von der Immich-Instanz des Nutzers verlangt, die wir nicht vorschreiben
  # koennen.
  include /etc/nginx/conf.d/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Das Denoise-Modell wiegt 91 MB und wird bedarfsgesteuert geladen und in
  # OPFS gecacht (Entscheidung 4). Traffic entsteht damit einmal pro Nutzer,
  # der Denoise wirklich benutzt — vorausgesetzt, der Browser darf es behalten.
  location /models/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Vite haengt einen Inhalts-Hash an jeden Asset-Namen.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Die Einstiegsseite darf nie kleben, sonst zeigt ein Deploy nicht.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
